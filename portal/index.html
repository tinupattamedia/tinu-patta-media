<style>
:root{--navy:#0b2466;--royal:#1a56b8;--gold:#c99a2e;--gold2:#e8c164;--ink:#0b1630;--mute:#4a5672;--line:#dfe5f1;--card:#f4f6fb;--bg:#fff;--ok:#1f8a4c;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--card);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(26px,4vw,34px)}h2{font-size:22px}h3{font-size:18px}
a{color:var(--royal)}
header{background:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
header .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font:700 18px Montserrat,sans-serif}
.brand img{height:40px;width:auto}
.sp{flex:1}
.who{font-size:14px;color:var(--mute)}
.lang{display:flex;border:2px solid var(--navy);border-radius:8px;overflow:hidden}
.lang button{min-width:44px;min-height:38px;border:0;background:#fff;color:var(--navy);font:700 13px Montserrat,sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
main{max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1px solid #c7d0e2;border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #bcd0f5;border-color:var(--royal)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:9px;border:0;background:var(--navy);color:#fff;font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0b1630}
.btn.line{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{background:#fff;color:var(--bad);border:2px solid var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font:600 14px Inter,sans-serif;color:var(--navy);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#e8edf8;color:var(--navy)}
.badge.ok{background:#dff3e7;color:var(--ok)}.badge.warn{background:#fff0d6;color:var(--warn)}.badge.bad{background:#fbe2e0;color:var(--bad)}
.msg{padding:12px 14px;border-radius:10px;margin:10px 0;font-size:15px}
.msg.ok{background:#dff3e7;color:#145c33}.msg.err{background:#fbe2e0;color:#7a1712}.msg.info{background:#e8edf8;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
.muted{color:var(--mute);font-size:14px}
.hero{background:linear-gradient(160deg,#0b2466,#1a56b8);color:#fff;border-radius:16px;padding:26px;margin-bottom:18px}
.hero p{color:#d5def3;margin:0}
.auth{max-width:520px;margin:0 auto}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.files li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.files{list-style:none;padding:0;margin:10px 0}
.meet{background:#e6f4ea;color:#0d652d;border:0}
dialog{border:0;border-radius:16px;padding:22px;max-width:min(760px,94vw);width:100%;box-shadow:0 30px 70px rgba(3,10,40,.45)}
dialog::backdrop{background:rgba(6,18,46,.55)}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 12px;font-size:15px}.kv dt{color:var(--mute)}.kv dd{margin:0}
[hidden]{display:none!important}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}header .in{gap:8px}.who{width:100%;order:9}}

const app = initializeApp({apiKey:"AIzaSyDaAcIrOl57jqGIx5muo9-Vs6UMv2a5VKE",authDomain:"osc-portal-d2f7b.firebaseapp.com",projectId:"osc-portal-d2f7b",storageBucket:"osc-portal-d2f7b.firebasestorage.app",messagingSenderId:"1082443960918",appId:"1:1082443960918:web:0b37872d2a3244e49361f7"});

};
let LANG = 'id';
try { LANG = localStorage.getItem('osc-lang') || (/^id\b/i.test(navigator.language||'') ? 'id' : 'en'); } catch (e) {}
if (LANG !== 'id' && LANG !== 'en') LANG = 'id';
const t = k => (T[LANG][k] ?? T.id[k] ?? k);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const STATUSES = ['baru','disaring','shortlist','interview','diterima','ditolak'];
const stBadge = s => `<span class="badge ${s==='diterima'?'ok':s==='ditolak'?'bad':s==='baru'?'':'warn'}">${esc(t('st_'+s))}</span>`;
const CERTS = ['BST','SAT / SDSD','Buku Pelaut / Seaman Book','Paspor / Passport','MCU','COC (ANT/ATT)','COP','GMDSS','Tanker (BOCT/BCT)'];
const fmtDate = v => { if (!v) return '-'; const d = v.toDate ? v.toDate() : new Date(v); return isNaN(d) ? esc(v) : d.toLocaleString(LANG==='id'?'id-ID':'en-GB',{dateStyle:'medium',timeStyle: v.toDate ? undefined : 'short', timeZone:'Asia/Makassar'}); };
const fmtMoney = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');
const track = (e,p) => { try { gtag('event', e, p||{}); } catch (x) {} };

function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === LANG)));
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.l; try { localStorage.setItem('osc-lang', LANG); } catch (e) {} applyStatic(); route(); }));
const dlg = $('#dlg');
$('#dlgClose').addEventListener('click', () => dlg.close());
const showDlg = html => { $('#dlgBody').innerHTML = html; applyStatic(); dlg.showModal(); };
const note = (el, kind, text) => { el.innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`; };
const errText = e => { const c = (e && e.code) || ''; const m = {
  'auth/invalid-credential': LANG==='id'?'Email atau kata sandi salah.':'Wrong email or password.',
  'auth/email-already-in-use': LANG==='id'?'Email sudah terdaftar. Silakan masuk.':'Email already registered. Please sign in.',
  'auth/weak-password': LANG==='id'?'Kata sandi minimal 6 karakter.':'Password must be at least 6 characters.',
  'auth/invalid-email': LANG==='id'?'Format email tidak valid.':'Invalid email format.',
  'auth/popup-closed-by-user': LANG==='id'?'Jendela login ditutup.':'Sign-in window closed.',
  'permission-denied': LANG==='id'?'Akses ditolak.':'Access denied.'}; return m[c] || t('errGeneric'); };

/* ---------------- State & routing ---------------- */
let USER = null, PROFILE = null;
const isAdmin = () => USER && USER.email === ADMIN_EMAIL && USER.emailVerified;
$('#logout').addEventListener('click', async () => { await signOut(auth); });

onAuthStateChanged(auth, async u => {
  USER = u; PROFILE = null;
  if (u) { try { const s = await getDoc(doc(db,'users',u.uid)); PROFILE = s.exists() ? s.data() : null; } catch (e) { PROFILE = null; } }
  $('#logout').hidden = !u;
  $('#who').textContent = u ? (u.email || '') : '';
  route();
});

function route() {
  applyStatic();
  if (!USER) return renderAuth();
  if (isAdmin()) return renderAdmin();
  if (!PROFILE) return renderCompleteProfile();
  if (PROFILE.role === 'crew') return renderCrew();
  if (PROFILE.role === 'principal') return renderPrincipal();
  renderCompleteProfile();
}

/* ---------------- Login / daftar ---------------- */
function roleFields(prefix) {
  return `<fieldset style="border:0;padding:0;margin:0 0 12px"><legend style="font-weight:600;margin-bottom:6px">${t('iam')}</legend>
    <label class="check"><input type="radio" name="${prefix}role" value="crew" checked> ${t('roleCrew')}</label>
    <label class="check"><input type="radio" name="${prefix}role" value="principal"> ${t('rolePrincipal')}</label></fieldset>
  <div class="grid2"><div><label for="${prefix}name">${t('fullname')}</label><input id="${prefix}name" required autocomplete="name"></div>
  <div><label for="${prefix}phone">${t('phone')}</label><input id="${prefix}phone" inputmode="tel" autocomplete="tel" placeholder="+62…"></div></div>
  <div class="grid2" id="${prefix}co" hidden style="margin-top:12px"><div><label for="${prefix}company">${t('company')}</label><input id="${prefix}company" autocomplete="organization"></div>
  <div><label for="${prefix}country">${t('country')}</label><input id="${prefix}country" autocomplete="country-name"></div></div>
  <label class="check" style="margin-top:14px"><input type="checkbox" id="${prefix}consent"> <span class="muted">${t('consent')}</span></label>`;
}
function wireRole(prefix) {
  document.querySelectorAll(`input[name=${prefix}role]`).forEach(r => r.addEventListener('change', () => { $('#'+prefix+'co').hidden = document.querySelector(`input[name=${prefix}role]:checked`).value !== 'principal'; }));
}
function readRole(prefix) {
  return { role: document.querySelector(`input[name=${prefix}role]:checked`).value, name: $('#'+prefix+'name').value.trim(), phone: $('#'+prefix+'phone').value.trim(),
    company: ($('#'+prefix+'company')||{}).value?.trim() || '', country: ($('#'+prefix+'country')||{}).value?.trim() || '', consent: $('#'+prefix+'consent').checked };
}
async function createProfile(u, d) {
  await setDoc(doc(db,'users',u.uid), { role: d.role, name: d.name || u.displayName || '', email: u.email, phone: d.phone, company: d.company, country: d.country, consent: true, consentAt: serverTimestamp(), createdAt: serverTimestamp(), lang: LANG });
  if (d.role === 'crew') await setDoc(doc(db,'crews',u.uid), { name: d.name || u.displayName || '', email: u.email, phone: d.phone, status: 'baru', sharedWith: [], createdAt: serverTimestamp() });
  track('portal_register', {role: d.role});
}

function renderAuth(mode='login') {
  $('#app').innerHTML = `<div class="hero"><h1>${t('welcome')}</h1><p>${t('welcomeP')}</p></div>
  <div class="card auth"><div class="tabs" role="tablist"><button role="tab" aria-selected="${mode==='login'}" data-m="login">${t('login')}</button><button role="tab" aria-selected="${mode==='register'}" data-m="register">${t('register')}</button></div>
  <form id="af" novalidate>
    ${mode==='register' ? roleFields('r') : ''}
    <div style="margin-top:12px"><label for="em">${t('email')}</label><input id="em" type="email" autocomplete="email" required></div>
    <div style="margin-top:12px"><label for="pw">${t('password')}</label><input id="pw" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" minlength="6" required></div>
    <div id="am"></div>
    <div class="row" style="margin-top:16px"><button class="btn" type="submit">${mode==='login'?t('login'):t('register')}</button>${mode==='login'?`<button class="btn line small" type="button" id="fg">${t('forgot')}</button>`:''}</div>
  </form>
  <div class="or">${t('or')}</div>
  <button class="btn line" type="button" id="gg" style="width:100%">${t('google')}</button></div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => renderAuth(b.dataset.m)));
  if (mode==='register') wireRole('r');
  const am = $('#am');
  $('#af').addEventListener('submit', async e => {
    e.preventDefault();
    const em = $('#em').value.trim(), pw = $('#pw').value;
    try {
      if (mode === 'login') { await signInWithEmailAndPassword(auth, em, pw); track('portal_login',{method:'email'}); }
      else {
        const d = readRole('r');
        if (!d.consent) return note(am,'err',t('needConsent'));
        const cred = await createUserWithEmailAndPassword(auth, em, pw);
        await createProfile(cred.user, d);
        try { await sendEmailVerification(cred.user); } catch (x) {}
        PROFILE = (await getDoc(doc(db,'users',cred.user.uid))).data();
        route();
      }

  }
  if (ADMIN_TAB === 'users') {
    pane.innerHTML = `<div class="scroll"><table><thead><tr><th>${t('name')}</th><th>${t('role')}</th><th>${t('company')}</th><th>${t('contact')}</th><th>${t('joined')}</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role==='crew'?t('crew'):t('principal'))}</td><td>${esc(u.company||'-')} ${u.country?`<div class="muted">${esc(u.country)}</div>`:''}</td><td>${esc(u.email)}<div class="muted">${esc(u.phone||'')}</div></td><td>${fmtDate(u.createdAt)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  } catch (x) { note(pane,'err',errText(x)); }
}
function adminCrewTools(c, principals) {
  const shared = (c.sharedWith||[]).map(id => principals.find(p=>p.uid===id)).filter(Boolean);
  return `<hr style="margin:18px 0;border:0;border-top:1px solid var(--line)">
  <div class="grid2"><div><label for="a_st">${t('setStatus')}</label><select id="a_st">${STATUSES.map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${esc(t('st_'+s))}</option>`).join('')}</select></div>
  <div><label for="a_nt">${t('adminNote')}</label><input id="a_nt" value="${esc(c.adminNote)}"></div></div>
  <button class="btn small" id="a_save" type="button" style="margin-top:10px">${t('save')}</button><span id="a_m"></span>
  <h3 style="margin-top:18px">${t('shareTo')}</h3>
  <p class="muted">${t('sharedWith')}: ${shared.length ? shared.map(p=>`${esc(p.company||p.name)} <button class="btn small danger" data-un="${esc(p.uid)}" type="button">${t('unshare')}</button>`).join(' ') : '-'}</p>
  <div class="row"><select id="a_pr" style="width:auto;flex:1"><option value="">${t('choose')}</option>${principals.map(p=>`<option value="${esc(p.uid)}">${esc(p.company||p.name)}</option>`).join('')}</select><button class="btn small" id="a_sh" type="button">${t('share')}</button></div>
  <h3 style="margin-top:18px">${t('schedule')}</h3>
  <div class="grid2"><div><label for="a_ip">${t('principal')}</label><select id="a_ip"><option value="">${t('choose')}</option>${principals.map(p=>`<option value="${esc(p.uid)}">${esc(p.company||p.name)}</option>`).join('')}</select></div>
  <div><label for="a_w">${t('when')}</label><input id="a_w" type="datetime-local"></div></div>
  <div style="margin-top:10px"><label for="a_ml">${t('meetLink')}</label><div class="row"><input id="a_ml" placeholder="https://meet.google.com/…" style="flex:1"><a class="btn small meet" href="https://meet.google.com/new" target="_blank" rel="noopener">${t('makeMeet')}</a></div><p class="muted">${t('makeMeetHint')}</p></div>
  <div><label for="a_in">${t('notes')}</label><input id="a_in"></div>
  <button class="btn gold" id="a_iv" type="button" style="margin-top:10px">${t('create')}</button><span id="a_im"></span>`;
}
function wireAdminCrewTools(c, principals) {
  const ref = doc(db,'crews',c.uid);
  $('#a_save').addEventListener('click', async () => { try { await updateDoc(ref, {status: $('#a_st').value, adminNote: $('#a_nt').value.trim()}); $('#a_m').textContent = ' ✓ ' + t('saved'); } catch (x) { $('#a_m').textContent = ' ' + errText(x); } });
  $('#a_sh').addEventListener('click', async () => { const p = $('#a_pr').value; if (!p) return; await updateDoc(ref, {sharedWith: arrayUnion(p)}); dlg.close(); renderAdmin(); });
  document.querySelectorAll('[data-un]').forEach(b => b.addEventListener('click', async () => { await updateDoc(ref, {sharedWith: arrayRemove(b.dataset.un)}); dlg.close(); renderAdmin(); }));
  $('#a_iv').addEventListener('click', async () => { const p = principals.find(x=>x.uid===$('#a_ip').value); const w = $('#a_w').value; const ml = $('#a_ml').value.trim();
    if (!p || !w) { $('#a_im').textContent = ' ' + t('choose'); return; }
    if (ml && !/^https:\/\/meet\.google\.com\//.test(ml)) { $('#a_im').textContent = ' https://meet.google.com/…'; return; }
    try { await addDoc(collection(db,'interviews'), { crewUid: c.uid, crewName: c.name, principalUid: p.uid, principalName: p.company||p.name, when: w + ':00+08:00', meetLink: ml, note: $('#a_in').value.trim(), status: 'terjadwal', createdAt: serverTimestamp() });
      await updateDoc(ref, {status: 'interview', sharedWith: arrayUnion(p.uid)}); dlg.close(); ADMIN_TAB='int'; renderAdmin(); }
    catch (x) { $('#a_im').textContent = ' ' + errText(x); } });
}
</script>
